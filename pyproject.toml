[project]
name = "toyota-citydriver-cli"
version = "0.1.0"
description = "CLI to list Toyota City Driver maintenance records and download service PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
]

[project.scripts]
tcd = "tcd_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcd_cli"]
